<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Climate Monitor - Global</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f7; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .card { background: #fff; padding: 20px; border-radius: 15px; width: 220px; text-align: center; border-top: 5px solid #e67e22; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-group button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; background: #2c3e50; color: white; font-weight: bold; }
        .btn-group button.active { background: #e67e22; }
        .chart-box { height: 450px; background: #fff; padding: 10px; }
        .download-btn { background: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="stats">
            <div class="card"><h3>Temperature</h3><p id="lt">--</p></div>
            <div class="card"><h3>Humidity</h3><p id="lh">--</p></div>
        </div>
        <div class="btn-group">
            <button id="btn-min" onclick="changeMode('min')" class="active">Minute (Live)</button>
            <button id="btn-hour" onclick="changeMode('hour')">Hourly Avg</button>
            <button id="btn-day" onclick="changeMode('day')">Daily Avg</button>
        </div>
        <div class="chart-box"><canvas id="mainChart"></canvas></div>
        <button class="download-btn" onclick="downloadCSV()">Download History CSV (IST)</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOQByve4Sk6AIboMEXTjo_Yxmc8ZSY2gg",
            authDomain: "live-temprature-monitoring.firebaseapp.com",
            projectId: "live-temprature-monitoring",
            databaseURL: "https://live-temprature-monitoring-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentMode = 'min';
        const ctx = document.getElementById('mainChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temperature (°C)',
                    data: [],
                    borderColor: '#e67e22',
                    backgroundColor: 'rgba(230, 126, 34, 0.2)',
                    borderWidth: 3,
                    pointRadius: 5,
                    pointBackgroundColor: '#e67e22',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        type: 'linear',
                        suggestedMin: 20,
                        suggestedMax: 45,
                        ticks: { stepSize: 2 }
                    }
                }
            }
        });

        // Live stats update
        db.ref('live').on('value', snap => {
            const v = snap.val();
            if(v) {
                document.getElementById('lt').innerText = v.temp + "°C";
                document.getElementById('lh').innerText = v.hum + "%";
            }
        });

        function refreshGraph() {
            db.ref('history').limitToLast(100).once('value', snap => {
                let labels = [];
                let temps = [];
                
                snap.forEach(child => {
                    const val = child.val();
                    if(val.time && val.t !== undefined) {
                        labels.push(val.time);
                        // FORCE conversion to float
                        let tempVal = parseFloat(val.t);
                        if(!isNaN(tempVal)) temps.push(tempVal);
                    }
                });

                if(currentMode === 'min') {
                    chart.data.labels = labels.slice(-10);
                    chart.data.datasets.data = temps.slice(-10);
                } else if(currentMode === 'hour') {
                    chart.data.labels = labels.filter((_, i) => i % 5 === 0).slice(-10);
                    chart.data.datasets.data = temps.filter((_, i) => i % 5 === 0).slice(-10);
                } else {
                    chart.data.labels = labels.filter((_, i) => i % 20 === 0).slice(-10);
                    chart.data.datasets.data = temps.filter((_, i) => i % 20 === 0).slice(-10);
                }
                chart.update();
            });
        }

        function changeMode(m) {
            currentMode = m;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + m).classList.add('active');
            refreshGraph();
        }

        function downloadCSV() {
            db.ref('history').once('value', snap => {
                let csv = "Date,Time,Temperature(C)\n";
                snap.forEach(child => {
                    const v = child.val();
                    csv += `${v.date},${v.time},${v.t}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'Climate_Data_IST.csv'; a.click();
            });
        }

        // Auto refresh every 20 seconds
        setInterval(refreshGraph, 20000);
        refreshGraph();
    </script>
</body>
</html>
