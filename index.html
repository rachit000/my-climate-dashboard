<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Climate Monitor - Force Render</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #status { padding: 10px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 10px; border-top: 4px solid #e67e22; background: #fff; width: 200px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chart-box { height: 400px; border: 1px solid #eee; padding: 10px; margin-bottom: 20px; position: relative; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: #fafafa; }
        th, td { border: 1px solid #ddd; padding: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="status">Firebase Connected ✅</div>
        <div class="stats">
            <div class="card"><h3>Temp</h3><h2 id="lt">--</h2></div>
            <div class="card"><h3>Hum</h3><h2 id="lh">--</h2></div>
        </div>

        <div class="chart-box">
            <canvas id="myChart"></canvas>
        </div>

        <button style="padding:10px 25px; background:#27ae60; color:white; border:none; border-radius:5px; cursor:pointer;" onclick="downloadCSV()">Download CSV</button>
        
        <h3>Debug Table (Last 10 Points)</h3>
        <table>
            <thead><tr><th>Time</th><th>Temperature (°C)</th></tr></thead>
            <tbody id="dataBody"></tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOQByve4Sk6AIboMEXTjo_Yxmc8ZSY2gg",
            databaseURL: "https://live-temprature-monitoring-default-rtdb.firebaseio.com",
            projectId: "live-temprature-monitoring"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myChart = null; // Global chart instance

        // Function to Draw/Redraw Chart
        function drawChart(labels, dataPoints) {
            const ctx = document.getElementById('myChart').getContext('2d');
            
            // If chart exists, destroy it before creating a new one
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Live Temperature',
                        data: dataPoints,
                        borderColor: '#e67e22',
                        backgroundColor: 'rgba(230, 126, 34, 0.2)',
                        borderWidth: 4,
                        pointRadius: 6,
                        pointBackgroundColor: '#e67e22',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false, // Disabled for performance
                    scales: {
                        y: { 
                            min: 20, 
                            max: 45,
                            ticks: { stepSize: 2 } 
                        }
                    }
                }
            });
        }

        // 1. Sync Live Cards
        db.ref('live').on('value', s => {
            const v = s.val();
            if(v) {
                document.getElementById('lt').innerText = v.temp + "°C";
                document.getElementById('lh').innerText = v.hum + "%";
            }
        });

        // 2. Sync History and Force Re-draw
        db.ref('history').limitToLast(10).on('value', snap => {
            let labels = [];
            let temps = [];
            let tableHTML = "";
            
            snap.forEach(child => {
                const v = child.val();
                let tNum = parseFloat(v.t);
                if(v.time && !isNaN(tNum)) {
                    labels.push(v.time);
                    temps.push(tNum);
                    tableHTML += `<tr><td>${v.time}</td><td>${tNum}</td></tr>`;
                }
            });

            document.getElementById('dataBody').innerHTML = tableHTML;
            
            // Re-draw the entire chart with the new data arrays
            drawChart(labels, temps);
        });

        function downloadCSV() {
            db.ref('history').once('value', s => {
                let csv = "Date,Time,Temp\n";
                s.forEach(c => { csv += `${c.val().date},${c.val().time},${c.val().t}\n`; });
                const blob = new Blob([csv], {type:'text/csv'});
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href=url; a.download='Climate_Report.csv'; a.click();
            });
        }
    </script>
</body>
</html>
